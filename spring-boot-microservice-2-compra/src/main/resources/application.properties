spring.application.name=compra-service
server.port=4444

spring.config.import=optional:file:./.env[.properties],optional:file:./spring-boot-microservice-2-compra/.env[.properties]

eureka.client.enabled=false

spring.datasource.url=jdbc:h2:mem:db_compra;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.security.users[0].username=admin
app.security.users[0].password=${ADMIN_PASSWORD}
app.security.users[0].role=ADMIN

app.security.users[1].username=dev
app.security.users[1].password=${DEV_PASSWORD}
app.security.users[1].role=DEV
