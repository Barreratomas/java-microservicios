spring.application.name=inmueble-service
server.port=3333

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/db_inmueble?currentSchema=sc_inmueble&ssl=false
spring.datasource.username=admin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.enabled=false

app.security.users[0].username=admin
app.security.users[0].password=${ADMIN_PASSWORD}
app.security.users[0].role=ADMIN

app.security.users[1].username=dev
app.security.users[1].password=${DEV_PASSWORD}
app.security.users[1].role=DEV